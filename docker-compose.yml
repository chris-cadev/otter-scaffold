services:
  app:
    build: .
    ports:
      - "9091:9091"
    restart: unless-stopped
    networks:
      - app_network
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app.db
      - JWT_SECRET=${JWT_SECRET}
      - SITE_URL=${SITE_URL}
  cloudflare:
    image: cloudflare/cloudflared:2026.2.0
    volumes:
      - ./.cloudflare:/home/nonroot/.cloudflared
    restart: unless-stopped
    networks:
      - app_network
    command: tunnel run app_tunnel

networks:
  app_network:
